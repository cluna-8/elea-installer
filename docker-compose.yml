version: '3.8'

# Instalador Elea — Guardian + cliente RAG + AnythingLLM, todo junto.
# Solo referencia IMÁGENES ya construidas (ghcr.io/cluna-8/...) — ningún código
# fuente del Guardian viaja en este repo. Ver install.sh e INSTALL.md.

services:
  db:
    image: postgres:16-alpine
    container_name: elea-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elea_gateway}
      POSTGRES_USER: ${POSTGRES_USER:-elea_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [elea-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elea_admin} -d ${POSTGRES_DB:-elea_gateway}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: elea-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [elea-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  nlp-analyzer:
    image: ghcr.io/cluna-8/elea-guardian-nlp:latest
    container_name: elea-nlp-analyzer
    networks: [elea-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:3000/health\")' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  engine:
    image: ghcr.io/cluna-8/elea-guardian-engine:latest
    container_name: elea-engine
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-elea_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-elea_gateway}
      - LITELLM_MASTER_KEY=${ENGINE_MASTER_KEY:?Falta ENGINE_MASTER_KEY en .env}
      - AZURE_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_API_BASE=${AZURE_OPENAI_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LITELLM_LOG=INFO
      - NLP_ANALYZER_URL=http://nlp-analyzer:3000
      - SENTINEL_ENTITY_REGION=${ENTITY_REGION:-latam_ar}
      - SENTINEL_AUDIT_FAIL=open
      # Bóveda de PII para RAG (opt-in, decisión de producto de Elea): sin esto, el
      # chat NUNCA restaura el dato real en una respuesta RAG — el enmascarado ocurre
      # en la subida del documento, un request completamente distinto (y mucho antes)
      # del chat que lo consulta después, así que no hay nada que desenmascarar sin
      # persistir el mapa en algún lado. Verificado en vivo (02-sep).
      - SENTINEL_PII_VAULT_ENABLED=${SENTINEL_PII_VAULT_ENABLED:-true}
      - SENTINEL_PII_VAULT_TTL_SECONDS=${SENTINEL_PII_VAULT_TTL_SECONDS:-7776000}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      nlp-analyzer: { condition: service_healthy }
    # exact-analysis-net (spec 048): exact-analysis-engine le habla directo a este motor con su
    # propia llave de servicio (svc.dbgpt-excel) — mismo patrón que anythingllm.
    networks: [elea-net, exact-analysis-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4000/health/readiness\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/cluna-8/elea-guardian-backend:latest
    container_name: elea-backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8091:8000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-elea_gateway}
      - POSTGRES_USER=${POSTGRES_USER:-elea_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SENTINEL_ENGINE_API_BASE=http://engine:4000
      - SENTINEL_ENGINE_MASTER_KEY=${ENGINE_MASTER_KEY}
      - AZURE_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_API_BASE=${AZURE_OPENAI_ENDPOINT}
      - AZURE_API_VERSION=${AZURE_API_VERSION}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FERNET_SECRET_KEY=${FERNET_SECRET_KEY:?Falta FERNET_SECRET_KEY en .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Falta JWT_SECRET_KEY en .env}
      - SENTINEL_LICENSE_TOKEN_FILE=/app/config/licenses/dev-demo.lic
      - SENTINEL_ALLOW_DEV_LICENSE=true
      - NLP_ANALYZER_URL=http://nlp-analyzer:3000
      - SENTINEL_ENTITY_REGION=${ENTITY_REGION:-latam_ar}
      - SENTINEL_AUDIT_FAIL=open
      # Mismo flag que `engine` (ver comentario ahí) — el backend escribe la bóveda en
      # /gw/inspect (masking de documentos RAG); el motor la lee al desenmascarar.
      - SENTINEL_PII_VAULT_ENABLED=${SENTINEL_PII_VAULT_ENABLED:-true}
      - SENTINEL_PII_VAULT_TTL_SECONDS=${SENTINEL_PII_VAULT_TTL_SECONDS:-7776000}
    depends_on:
      db: { condition: service_healthy }
      engine: { condition: service_healthy }
    # exact-analysis-net (spec 048): único servicio, además de engine, con ruta hacia el motor
    # de análisis exacto — proxy de autenticación/atribución hacia DB-GPT.
    networks: [elea-net, exact-analysis-net]
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  frontend:
    image: ghcr.io/cluna-8/elea-guardian-frontend:latest
    container_name: elea-frontend
    ports:
      - "8090:5173"
    # Marca como CONFIG en runtime, no horneada (mismo criterio que spec 020 US2 y
    # deploy/docker/compose.prod.yml) — `loadBranding()` (frontend/src/main.tsx) pide
    # `/branding/brand.json` ANTES del primer render. Sin este mount, el panel cae al
    # default de fábrica ("Sentinel Secure AI Gateway") en vez de "Eleia Guardian" — bug
    # real encontrado el 09-sep, nunca se había cableado para este instalador.
    # `./branding` acá adentro apunta a `/app/public/branding` porque la imagen de hoy
    # corre `npm run dev` (puerto 5173, `frontend/Dockerfile`), que sirve `public/` tal
    # cual. Si en algún momento se cambia a la imagen de producción (Caddy, puerto 8080,
    # `deploy/docker/frontend.prod.Dockerfile`), este mount pasa a `/srv/branding:ro` y
    # el puerto publicado a `8090:8080` — los dos cambian juntos, no por separado.
    volumes:
      - ./branding:/app/public/branding:ro
    depends_on:
      - backend
    networks: [elea-net]
    restart: unless-stopped

  anythingllm:
    # Versión fijada (spec 043 US1, T021 — antes `:latest`, sin control de cuándo cambia).
    # 1.16.1 confirmada como la más reciente publicada en Docker Hub al 08-sep-2026. Subir la
    # versión es una tarea deliberada con prueba, no un efecto colateral de un `docker pull`.
    image: mintplexlabs/anythingllm:1.16.1
    container_name: elea-anythingllm
    # NO se publica el puerto al host (08-sep): el aislamiento por usuario (spec 043 US1) vive
    # en el backend Guardian y en Eleia Hub — si este puerto llegara a estar expuesto, cualquiera
    # en la misma red podría hablar directo con AnythingLLM (single-user, sin las verificaciones
    # nuevas) y saltearse todo ese control. Solo `client` (misma red `elea-net`) necesita hablarle.
    expose:
      - "3001"
    environment:
      - SERVER_PORT=3001
      - STORAGE_DIR=/app/server/storage
      - DISABLE_TELEMETRY=true
    volumes:
      - anythingllm_data:/app/server/storage
    networks: [elea-net]
    restart: unless-stopped

  client:
    image: ghcr.io/cluna-8/elea-rag-client:latest
    container_name: elea-rag-client
    ports:
      - "8095:8095"
    environment:
      - PORT=8095
      - ELEA_BACKEND_URL=http://backend:8000/api/v1
      # ELEA_SERVICE_USERNAME/PASSWORD: quitadas (09-sep) — `server.js` ya no las lee
      # desde que T022 de la 044 cambió el presupuesto a autoservicio (sesión propia de
      # cada persona, no una cuenta de admin de fondo); quedaban acá sin ningún efecto.
      - ANYTHINGLLM_URL=http://anythingllm:3001
      - ANYTHINGLLM_API_KEY=${ANYTHINGLLM_API_KEY:-}
      - MASKING_VIRTUAL_KEY=${MASKING_VIRTUAL_KEY:-}
      # Marca en runtime (encontrado en revisión, 09-sep): "Eleia Hub es un cliente más" —
      # el código del Hub no tiene ninguna marca atada, la fija ESTA instalación por env.
      - HUB_BRAND_NAME=Eleia Hub
      - HUB_BRAND_TAGLINE=Gobernanza IA y RAG Corporativo
      - HUB_BRAND_TENANT_LABEL=Laboratorios ELEA
      - HUB_BRAND_GOVERNANCE_LABEL=Eleia GuardIAn
      # El default del código pasó a ser un logo neutro (guardian-logo.svg, 09-sep) —
      # esta instalación fija el logo real de Eleia explícitamente, para no perderlo.
      - HUB_BRAND_LOGO_URL=/eleia-logo.png
    volumes:
      - client_uploads:/app/public/uploads
    depends_on:
      - backend
      - anythingllm
    networks: [elea-net]
    restart: unless-stopped

  exact-analysis-engine:
    # Motor de análisis exacto de datos Excel/CSV (spec 048, DB-GPT). PIN POR DIGEST — nunca
    # `:latest`, bump deliberado con prueba (mismo criterio que anythingllm arriba). v0.8.2
    # confirmada como la más reciente publicada al 10-sep-2026 (imagen `dbgpt-openai`: liviana,
    # solo el proxy model, sin modelo local pesado — research.md R1 de la 048).
    image: eosphorosai/dbgpt-openai@sha256:bd7d35ce7994f0f977007c28c839fffcdc80cfa810fa12ead9aecfd4e9b3d11f
    container_name: elea-exact-analysis-engine
    # SIN `ports:` — mitigación obligatoria (CVE-2026-80104, RCE crítica sin autenticación, ver
    # research.md R4 de la 048). Ni siquiera para administración (a diferencia de anythingllm):
    # la superficie de esta CVE es demasiado seria para la comodidad de un puerto de debug.
    expose:
      - "5670"
    environment:
      - LLM_MODEL_PROVIDER=proxy/openai
      # El motor interno de Eleia (LiteLLM), nunca una credencial de Azure directa — pedido
      # explícito del dueño del producto (10-sep): "que use a Eleia para los modelos y el costo".
      - OPENAI_API_BASE=http://engine:4000/v1
      - OPENAI_API_KEY=${DBGPT_ENGINE_VIRTUAL_KEY:-}
      - LLM_MODEL_NAME=${DBGPT_ENGINE_MODEL_NAME:-azure-gpt-4o-mini}
    volumes:
      - exact_analysis_data:/app/pilot/data
    networks: [exact-analysis-net]
    restart: unless-stopped

networks:
  elea-net:
    driver: bridge
  # Red aislada del motor de análisis exacto (spec 048, FR-002) — internal:true además de sin
  # `ports:`: ni un error de configuración que agregara `ports:` dejaría el contenedor
  # alcanzable desde fuera del host, porque la red en sí no tiene salida.
  exact-analysis-net:
    driver: bridge
    internal: true

volumes:
  pgdata:
  anythingllm_data:
  exact_analysis_data:
  client_uploads:
